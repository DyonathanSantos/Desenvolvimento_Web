<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro</title>
</head>

<body>

    <main class="secao-padrao">

        <div class="container">
            <h1 class="text-center">Cadastre Clientes Aqui</h1>
            <h3 class="text-center"> Site que simula cadastro</h3>
            <br>

            <div class="linha">
                <!--Coluna da Esquerda-->
                <div class="coluna3">
                    <div class="card-perfil">
                        <h3 class="text-center">Cadastro Cliente</h3>
                        <br>

                        <form id="form-cadastro" class="formulario-padrao">

                            <div class="campo-grupo">
                                <label for="nome">Nome:</label>
                                <input type="text" name="nome" id="nome" required>
                            </div>

                            <div class="campo-grupo">
                                <label for="telefone">Telefone:</label>
                                <input type="tel" name="telefone" id="telefone" required>
                            </div>

                            <div class="campo-grupo">
                                <label for="observacao">Observação:</label>
                                <textarea name="observacao" id="observacao" cols="50" rows="4"
                                    placeholder="Digite as observações aqui"></textarea>
                            </div>

                            <button type="submit" class="botao">
                                Cadastrar
                            </button>
                        </form>
                    </div>
                </div>

                <!--Coluna do meio-->
                <div class="coluna3">
                    <div class="card-perfil">
                        <h3 class="text-center">Lista de Clintes</h3>
                        <br>

                        <table class="tabela">
                            <thead>
                                <tr>
                                    <th>Nome</th>
                                    <th>Telefone</th>
                                    <th>Observações</th>
                                </tr>
                            </thead>
                            <tbody id="lista-clientes"></tbody>
                        </table>
                    </div>
                </div>

                <!-- Terceira Coluna-->
                 <div class="coluna3">
                    <div class="card-perfil">
                        <h3 class="text-center">Edite um cliente</h3>
                        <br>

                        <table class="tabela">
                            <thead>
                                <tr>
                                    <th>Clientes:</th>
                                </tr>
                            </thead>
                            <tbody id="update-client-list"></tbody>
                        </table>
                    </div>
                 </div>
            </div>
        </div>

    </main>


</body>

</html>
